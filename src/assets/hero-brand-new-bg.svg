<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dark Deep Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Radial Emerald Ambient Glow -->
    <radialGradient id="emeraldGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Cyan Accent Glow -->
    <radialGradient id="cyanGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Grid Lines Pattern -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <!-- Subtle Bokeh Glow Circle Filter -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- 1. Base Dark Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- 2. Ambient Glow Layers -->
  <rect width="1920" height="1080" fill="url(#emeraldGlow)" />
  <rect width="1920" height="1080" fill="url(#cyanGlow)" />

  <!-- 3. Minimal Grid Mesh -->
  <rect width="1920" height="1080" fill="url(#gridPattern)" opacity="0.6" />

  <!-- 4. Soft Bokeh Lights -->
  <circle cx="400" cy="300" r="220" fill="#10b981" opacity="0.08" filter="url(#blurFilter)" />
  <circle cx="1500" cy="450" r="280" fill="#0284c7" opacity="0.08" filter="url(#blurFilter)" />
  <circle cx="960" cy="200" r="350" fill="#059669" opacity="0.07" filter="url(#blurFilter)" />

  <!-- 5. Decorative Perspective Tech Library Rays -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="960" y1="0" x2="0" y2="1080" />
    <line x1="960" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="1440" y2="1080" />
    <line x1="960" y1="0" x2="1920" y2="1080" />
  </g>

  <!-- 6. Floating Abstract Book Silhouette Accents -->
  <g fill="#10b981" opacity="0.08">
    <rect x="250" y="650" width="120" height="160" rx="8" transform="rotate(-12 250 650)"/>
    <rect x="1600" y="680" width="140" height="180" rx="10" transform="rotate(15 1600 680)"/>
  </g>
</svg>
